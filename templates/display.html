<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Alarmmonitor</title>
    <style>
        body { background: #111; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; box-sizing: border-box; }
        .idle-container { text-align: center; margin-top: 15vh; color: #444; }
        .idle-title { font-size: 3.5em; font-weight: bold; letter-spacing: 3px; margin-bottom: 20px; color: #2ecc71; }
        .idle-clock { font-size: 6em; font-weight: bold; color: #888; font-family: monospace; }
        .audio-hint { margin-top: 25px; font-size: 1.1em; color: #e67e22; cursor: pointer; display: inline-block; padding: 8px 15px; border: 1px dashed #e67e22; border-radius: 6px; }
        
        .alarm-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
        .alarm-card { border: 4px solid #e74c3c; padding: 20px; background: #1a1a1a; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .stichwort { background: #c0392b; color: #fff; font-size: 2.6em; padding: 15px; text-align: center; font-weight: bold; border-radius: 8px; }
        .details { font-size: 1.7em; margin-top: 15px; line-height: 1.5; flex-grow: 1; }
        .label { color: #f39c12; font-weight: bold; display: inline-block; width: 140px; }
        .timer-box { margin-top: 15px; font-size: 1.3em; color: #2ecc71; text-align: right; border-top: 1px solid #333; padding-top: 10px; }

        .offline-banner { display: none; position: fixed; top: 0; left: 0; right: 0; background: #e67e22; color: #fff; text-align: center; padding: 10px; font-weight: bold; font-size: 1.2em; z-index: 9999; }

        @keyframes flash {
            0% { border-color: #e74c3c; }
            50% { border-color: #f1c40f; }
            100% { border-color: #e74c3c; }
        }
        .flashing { animation: flash 0.8s 4; }
    </style>
</head>
<body onclick="unlockAudio()">

<div id="offlineBanner" class="offline-banner">VERBINDUNG ZUM SERVER UNTERBROCHEN</div>

<div id="idle" class="idle-container">
    <div class="idle-title">EINSATZBEREIT</div>
    <div id="clock" class="idle-clock">00:00:00</div>
    <div id="audioHint" class="audio-hint" onclick="unlockAudio()">🔔 Bildschirmoberfläche anklicken um Alarmton freizuschalten</div>
</div>

<div id="grid" class="alarm-grid"></div>

<audio id="gong" preload="auto"></audio>

<script>
    var knownAlarmIds = {};
    var currentAlarms = [];
    var audioUnlocked = false;

    function unlockAudio() {
        if (!audioUnlocked) {
            var audio = document.getElementById('gong');
            audio.play().then(function() {
                audio.pause();
                audio.currentTime = 0;
                audioUnlocked = true;
                var hint = document.getElementById('audioHint');
                if (hint) hint.style.display = 'none';
            }).catch(function(e) {});
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function updateClock() {
        var now = new Date();
        var hrs = String(now.getHours()).padStart(2, '0');
        var mins = String(now.getMinutes()).padStart(2, '0');
        var secs = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').innerText = hrs + ':' + mins + ':' + secs;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateTimers() {
        var now = Math.floor(Date.now() / 1000);
        for (var i = 0; i < currentAlarms.length; i++) {
            var a = currentAlarms[i];
            var timerEl = document.getElementById('timer-' + a.id);
            if (timerEl) {
                var diff = Math.max(0, Math.floor(now - a.timestamp));
                var mins = String(Math.floor(diff / 60)).padStart(2, '0');
                var secs = String(diff % 60).padStart(2, '0');
                timerEl.innerText = mins + ':' + secs;
            }
        }
    }
    setInterval(updateTimers, 1000);

    function playAlarmSound() {
        fetch('/api/settings')
            .then(function(res) { return res.json(); })
            .then(function(settings) {
                var soundFile = settings.selected_sound || 'gong.mp3';
                var audio = document.getElementById('gong');
                audio.src = '/static/' + soundFile;
                audio.currentTime = 0;
                audio.play().catch(function(e) {});
            })
            .catch(function(err) {});
    }

    function poll() {
        fetch('/api/alarm')
            .then(function(res) {
                if (!res.ok) throw new Error("HTTP Fehler");
                return res.json();
            })
            .then(function(alarms) {
                document.getElementById('offlineBanner').style.display = 'none';

                var idleEl = document.getElementById('idle');
                var gridEl = document.getElementById('grid');

                if (!alarms || alarms.length === 0) {
                    idleEl.style.display = 'block';
                    gridEl.innerHTML = '';
                    knownAlarmIds = {};
                    currentAlarms = [];
                    return;
                }

                idleEl.style.display = 'none';

                var newIdsObj = {};
                var isNewAlarmTriggered = false;
                for (var i = 0; i < alarms.length; i++) {
                    var a = alarms[i];
                    newIdsObj[a.id] = true;
                    if (!knownAlarmIds[a.id]) {
                        knownAlarmIds[a.id] = true;
                        isNewAlarmTriggered = true;
                    }
                }

                if (isNewAlarmTriggered) {
                    playAlarmSound();
                }

                currentAlarms = alarms;
                var now = Math.floor(Date.now() / 1000);
                var htmlContent = '';

                for (var j = 0; j < alarms.length; j++) {
                    var a = alarms[j];
                    var diff = Math.max(0, Math.floor(now - a.timestamp));
                    var mins = String(Math.floor(diff / 60)).padStart(2, '0');
                    var secs = String(diff % 60).padStart(2, '0');
                    var flashClass = isNewAlarmTriggered ? 'flashing' : '';

                    htmlContent += '<div class="alarm-card ' + flashClass + '">' +
                        '<div class="stichwort">' + escapeHtml(a.stichwort) + '</div>' +
                        '<div class="details">' +
                            '<p><span class="label">Ort:</span> ' + escapeHtml(a.adresse) + '</p>' +
                            '<p><span class="label">Einheiten:</span> ' + escapeHtml(a.fahrzeuge) + '</p>' +
                            '<p><span class="label">Hinweis:</span> ' + (escapeHtml(a.hinweis) || '-') + '</p>' +
                        '</div>' +
                        '<div class="timer-box">' +
                            'Alarmzeit: ' + escapeHtml(a.timestr) + ' | Laufzeit: <span id="timer-' + a.id + '">' + mins + ':' + secs + '</span>' +
                        '</div>' +
                    '</div>';
                }
                gridEl.innerHTML = htmlContent;
            })
            .catch(function(err) {
                document.getElementById('offlineBanner').style.display = 'block';
            });
    }

    setInterval(poll, 1000);
</script>
</body>
</html>
